name: build-executables

# Reusable workflow: builds the 3 Nuitka mockymock executables. Called by
# release-please.yml (automatic, on a release-please release) and by
# publish-public.yml (manual, via workflow_dispatch) so both paths share
# one build definition instead of two that can drift. See PUBLISHING.md.

on:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mockymock-linux-x86_64
          - os: macos-latest
            artifact: mockymock-macos-arm64
          - os: windows-latest
            artifact: mockymock-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # cobolparser is a private repo; the pyproject.toml dependency line
      # pins it via git+https, which pip/git can only resolve here if
      # COBOL_PARSER_PAT (a PAT/deploy key with read access) is configured
      # as a secret, or cobol-parser is public. Same documented gap/fallback
      # as ci.yml's "Check out cobol-parser (sibling editable dependency)"
      # step -- if neither holds, this fails loudly at the install step
      # below rather than silently producing a broken build.
      - name: Configure git credentials for the private cobolparser dependency
        # shell: bash is required here -- run: steps default to pwsh on
        # windows-latest, and pwsh parses ${TOKEN} as an (unset) PowerShell
        # variable rather than expanding the env var, silently embedding an
        # empty token in the rewritten URL. That only breaks the Windows
        # matrix leg (Linux/macOS default to bash already) and surfaces as
        # git's generic "Invalid username or token" auth failure rather than
        # a shell error, so pin bash explicitly on every OS.
        shell: bash
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          TOKEN: ${{ secrets.COBOL_PARSER_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install patchelf (required by Nuitka onefile mode on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install mockymock (pulls in the pinned cobolparser dependency)
        run: pip install .
      - name: Install Nuitka
        run: pip install nuitka
      - name: Build onefile executable
        shell: bash
        run: scripts/build_executable.sh "${{ matrix.artifact }}"
      - name: Smoke-test the executable
        shell: bash
        run: |
          BIN="build/${{ matrix.artifact }}"
          chmod +x "$BIN" || true
          "$BIN" --help
      - name: Analyze subcommand bundles cobolparser's CLI
        # _cmd_analyze is the only place in mockymock that imports anything
        # from cobolparser.cli -- every other code path only reaches
        # cobolparser.models/.parsers/.lexer/.preprocess/.generators. A
        # Nuitka bundling miss for this specific subpackage would pass the
        # plain --help smoke test above (analyze --help never imports
        # cobolparser.cli.parse -- that import is inside _cmd_analyze, not
        # reached by argparse's own -h handling) and would also pass the
        # extension's own capability probe, which only checks
        # `analyze --help`. This step is the only thing that actually
        # exercises the import.
        shell: bash
        run: |
          BIN="build/${{ matrix.artifact }}"
          "$BIN" analyze dead-code examples/custinq/CUSTINQ.cbl --compact | head -c 200
      - name: End-to-end smoke test against a real example (Docker required)
        # GitHub-hosted ubuntu-latest runners have a working Docker daemon;
        # macos-latest/windows-latest don't reliably, and mockymock is
        # Docker-only by design (see docker_toolchain.py), so this step is
        # Linux-only. `setup` also exercises the bundled Dockerfile data
        # file (mockymock.runtime.docker_toolchain reads it at import time,
        # before touching Docker at all -- see PUBLISHING.md), so a clean
        # "Docker not available"-style failure here would still mean the
        # bundling worked; an unhandled Python traceback would mean it didn't.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BIN="build/${{ matrix.artifact }}"
          "$BIN" setup
          "$BIN" run examples/custinq/CUSTINQ.cbl --cut examples/custinq/CUSTINQ.cut
      - name: Dashboard serves its bundled static assets
        # Guards the same bug class as the Dockerfile above, for the one
        # artifact where unit tests can't: Nuitka ignores pyproject's
        # package-data, so mockymock/web/static/ only reaches the binary via
        # build_executable.sh's --include-data-dir. Without it the page 404s
        # here while every test passes. Port 0 would hide the port, so pin
        # one; --no-browser keeps the runner headless.
        shell: bash
        run: |
          BIN="build/${{ matrix.artifact }}"
          "$BIN" dashboard --port 8765 --no-browser &
          DASH=$!
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ | grep -q "toolchain status"
          curl -fsS http://127.0.0.1:8765/style.css >/dev/null
          curl -fsS http://127.0.0.1:8765/app.js >/dev/null
          curl -fsS http://127.0.0.1:8765/api/status | grep -q '"checks"'
          kill "$DASH" || true

      - uses: actions/upload-artifact@v4
        with:
          name: dist-exe-${{ matrix.os }}
          path: build/${{ matrix.artifact }}
