name: CI

# Tiers (see .okf/testing.md):
#   lint             push/PR   ruff check + ruff format + mypy, against the
#                              locked dependencies (cobol-parser included, so
#                              mypy sees its real types).
#   unit             push/PR   tests/unit on Linux (every supported Python)
#                              plus Windows and macOS, from uv.lock.
#   cobol-parser-*   nightly   tests/unit against the newest published
#                              cobol-parser and against the declared floor,
#                              so the whole `cobol-parser>=X,<Y` range is run.
#   integration      nightly   tests/integration: the Docker/GnuCOBOL tier.
#                              Too slow to gate every PR, too important to
#                              never run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy mockymock/

  unit:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: Unit tests
        run: uv run pytest tests/unit

  # Both ends of the declared cobol-parser range. The lockfile pins one
  # version; users get whatever pip resolves, so the newest release and the
  # floor are each run nightly. A red run here means: bump the floor, or
  # tighten the cap, before users hit it.
  cobol-parser-range:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        end: [newest, floor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      # One resolve per leg, so everything else is resolved against the
      # cobol-parser under test. The floor is read from pyproject.toml, the
      # single place it is declared.
      - name: Install (unlocked)
        run: |
          uv venv
          if [ "${{ matrix.end }}" = floor ]; then
            floor=$(uv run --no-project python -c 'import re, tomllib; deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]; print(next(re.search(r">=\s*([\w.]+)", d).group(1) for d in deps if d.startswith("cobol-parser")))')
            echo "cobol-parser floor: $floor"
            uv pip install -e ".[dev]" "cobol-parser==$floor"
          else
            uv pip install -e ".[dev]" --upgrade
          fi
      - name: Unit tests
        run: uv run --no-sync pytest tests/unit

  integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install (locked)
        run: uv sync --locked --extra dev
      # ubuntu-latest ships a Linux Docker daemon; the tier builds the
      # mockymock-gnucobol image on first use (~1 min).
      - name: Integration tests
        run: uv run pytest tests/integration --no-cov
