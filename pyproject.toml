[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mockymock"
version = "0.13.0"
description = "Mock COBOL CALL statements, compile with GnuCOBOL, run, and assert"
authors = [
    {name = "Samuel Dion"}
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
keywords = ["cobol", "mainframe", "testing", "gnucobol", "mocking"]
dependencies = [
    # cobol-parser is published to PyPI (AGPL-3.0-or-later, like this
    # project; see .okf/integration.md), so it resolves as a normal versioned dependency
    # instead of a pinned sibling-checkout/git install. 1.7.7 is the first
    # published version and carries every fix this project previously
    # tracked via git SHA (DIVIDE/MULTIPLY GIVING ROUNDED, the gen-fixtures
    # bundle surface, EVALUATE WHEN-clause truncation, ...). Bump the floor
    # deliberately, with a test run, when adopting new cobol-parser work --
    # the <4 cap guards against an unreviewed breaking major bump (2.x was
    # reviewed 2026-10-14: the unit suite passes unchanged on 2.0.1; 3.x on
    # 2026-10-15: its one breaking change is the `decode --view` column set,
    # which this project never calls, and the unit suite passes unchanged on
    # 3.0.0). The Report
    # Writer categories (INITIATE/GENERATE/TERMINATE), the INVOKE/CHAIN/
    # Communication-Module refusals and the XML PARSE flow edge need the
    # cobol-parser release carrying its 2026-09-02 statement-coverage and
    # REPORT SECTION work; on older releases those verbs still warn (and so
    # refuse PARSE_WARNING) and the extra node classes resolve to nothing
    # (mock_surface._optional_statement_types), so the floor stays.
    #
    # The universal `cobol.yml` config (cli/config.py) needs
    # `cobolparser.config`, which lands in cobol-parser 1.10. The floor is
    # deliberately NOT raised for it: everything else here works on 1.7.7,
    # and a project that never writes a cobol.yml should not be forced to
    # upgrade. `_universal_values` soft-imports and, only when a cobol.yml
    # actually exists, fails with a message naming the version to install.
    # 1.8.2 is excluded: its published wheel raises "Expected type, got
    # ABCMeta" from BoundaryInventoryAnalyzer._classify on every program,
    # which breaks `generate` (whose default is now the data-driven path)
    # and `init`. 1.8.0 and 1.8.4 are fine.
    #
    # 3.1 (reviewed 2026-10-29) changed three things this project reads,
    # all handled now: the bundle's tier-1 `call_count` is one per
    # (category, key) and only when exact (cobol-parser #363), so
    # `generate` restores the per-site counts its own exactness analysis
    # starts from (`_with_site_call_counts`); a literal CALL USING argument
    # keeps its quotes ("ABC", not ABC; `injector.reported_literal`); and
    # the native entry-parameter stubs miss a field set only through its
    # 88s, which `add_entry_parameters` tops up. The unit suite passes on
    # 3.0.0, 3.1.1 and cobol-parser main.
    "cobol-parser>=1.7.7,!=1.8.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]

[project.scripts]
mockymock = "mockymock.cli.main:main"

[tool.setuptools.packages.find]
include = ["mockymock*"]

[tool.setuptools.package-data]
# PEP 561: the code is fully annotated; py.typed makes the annotations
# visible to downstream mypy.
mockymock = ["py.typed"]
# Docker build context lives under the package (not repo-root docker/) so it
# ships in the wheel -- `mockymock setup` needs it under any install mode,
# including a bare `uv tool install` with no sibling checkout present.
"mockymock.runtime" = ["docker/Dockerfile"]
# Same reasoning for the dashboard's static assets: they live under the
# package and are resolved via Path(__file__), so they must be packaged
# explicitly or `mockymock dashboard` 404s under `uv tool install`.
"mockymock.web" = ["static/**/*"]
# The packaged Claude Code skill `mockymock skills install` copies out;
# same "must be under a discovered package, resolved via Path(__file__)"
# reasoning as the two entries above. Recursive glob (not two literal
# globs) so any future file added under skills/ -- e.g. an examples/
# subdirectory -- ships in the wheel without another pyproject.toml edit.
"mockymock.cli" = ["skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--cov=mockymock",
    "--cov-report=term-missing",
    # Measured at 85% on tests/unit (2026-07-07); floor set 2 points below
    # so genuine regressions fail while normal churn doesn't.
    "--cov-fail-under=83",
]

[tool.coverage.run]
source = ["mockymock"]
branch = true

[tool.coverage.report]
precision = 2

# Lint/format configs mirror the sibling cobol-parser repo (same
# selects/ignores/line length) so contributors move between the two repos
# without switching styles.

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py files
# The test suite's established style groups related tests under mid-file
# section banners with their own imports.
"tests/**" = ["E402"]

[tool.black]
target-version = ["py311"]
line-length = 88

# mypy: deliberately pragmatic rather than the sibling repo's strict mode --
# settings chosen so the current, fully-annotated code passes; tighten
# incrementally rather than blanket-ignoring whole modules.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
