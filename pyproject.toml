[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mockymock"
version = "0.16.1"
description = "Mock COBOL CALL statements, compile with GnuCOBOL, run, and assert"
authors = [
    {name = "Samuel Dion"}
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
keywords = ["cobol", "mainframe", "testing", "gnucobol", "mocking"]
dependencies = [
    # cobol-parser (PyPI, AGPL-3.0-or-later; see .okf/integration.md).
    # The floor is the oldest release CI actually runs: the nightly
    # `cobol-parser-range` job runs the unit tier against it and against the
    # newest release in range (CI reads the floor from this line). Raise it
    # when adopting new cobol-parser work; never add a compatibility shim
    # for a release below it. The <4 cap guards
    # against an unreviewed major; review a new major against the unit tier
    # before lifting it. Version-by-version review notes are in
    # .okf/integration.md.
    "cobol-parser>=3.1.1,<4",
]

[project.optional-dependencies]
# `mockymock job` (integration tests level 3) reads JCL through
# cobol-parser's `cobolparser.jcl`, which needs jcl-parser.
jcl = ["cobol-parser[jcl]"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.15",
    "mypy>=1.5.0",
]

[project.scripts]
mockymock = "mockymock.cli.main:main"

[tool.setuptools.packages.find]
include = ["mockymock*"]

[tool.setuptools.package-data]
# PEP 561: the code is fully annotated; py.typed makes the annotations
# visible to downstream mypy.
mockymock = ["py.typed"]
# Docker build context lives under the package (not repo-root docker/) so it
# ships in the wheel -- `mockymock setup` needs it under any install mode,
# including a bare `uv tool install` with no sibling checkout present.
"mockymock.runtime" = ["docker/Dockerfile"]
# IBM-supplied copybooks a program COPYs but an application export never
# holds (cli/discovery.py SYSTEM_COPYBOOK_DIR).
"mockymock.copybooks" = ["system/*.cpy"]
# Same reasoning for the dashboard's static assets: they live under the
# package and are resolved via Path(__file__), so they must be packaged
# explicitly or `mockymock dashboard` 404s under `uv tool install`.
"mockymock.web" = ["static/**/*"]
# The packaged Claude Code skill `mockymock skills install` copies out;
# same "must be under a discovered package, resolved via Path(__file__)"
# reasoning as the two entries above. Recursive glob (not two literal
# globs) so any future file added under skills/ -- e.g. an examples/
# subdirectory -- ships in the wheel without another pyproject.toml edit.
"mockymock.cli" = ["skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--cov=mockymock",
    "--cov-report=term-missing",
    # Measured at 85% on tests/unit (2026-07-07); floor set 2 points below
    # so genuine regressions fail while normal churn doesn't.
    "--cov-fail-under=83",
]

[tool.coverage.run]
source = ["mockymock"]
branch = true

[tool.coverage.report]
precision = 2

# Lint config mirrors the sibling cobol-parser repo (same
# selects/ignores/line length) so contributors move between the two repos
# without switching styles.

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py files
# The test suite's established style groups related tests under mid-file
# section banners with their own imports.
"tests/**" = ["E402"]

# mypy: deliberately pragmatic rather than the sibling repo's strict mode --
# settings chosen so the current, fully-annotated code passes; tighten
# incrementally rather than blanket-ignoring whole modules.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
